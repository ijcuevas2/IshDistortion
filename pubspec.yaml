# Workspace root manifest for the SigmaDraw melos monorepo.
#
# Two things live in this one file, as required by melos >=7 and by Dart's
# native "workspace" feature (https://dart.dev/tools/pub/workspaces):
#
# 1. `workspace:` — the Dart/Flutter pub workspace member list. This makes
#    `dart pub get` / `flutter pub get` resolve every member's external
#    dependencies (xml, fluent_ui, riverpod, ...) jointly from one root
#    lockfile, instead of each package pinning its own possibly-incompatible
#    versions. Every path here needs `resolution: workspace` in its own
#    pubspec.yaml.
# 2. `melos:` — melos-specific config (scripts, bootstrap options). Melos
#    reuses the `workspace:` list above as its package set; there is no
#    separate melos.yaml file in melos >=7.
#
# Usage: `dart pub get` once at the root, then `dart run melos bootstrap`.
name: sigmadraw_workspace
publish_to: none

environment:
  sdk: ^3.13.2

workspace:
  - apps/sigmadraw
  - packages/sd_commands
  - packages/sd_document
  - packages/sd_export
  - packages/sd_graph
  - packages/sd_ink
  - packages/sd_input
  - packages/sd_latex
  - packages/sd_render
  - packages/sd_stencils
  - packages/sd_ui

dev_dependencies:
  melos: ^8.6.0

melos:
  command:
    bootstrap:
      runPubGetInParallel: true

  scripts:
    analyze:
      description: Static analysis across every package in the workspace.
      exec:
        command: dart analyze --fatal-infos .
        concurrency: 4
        failFast: false

    format-check:
      description: Fail if any file is not formatted with `dart format`.
      exec:
        command: dart format --output=none --set-exit-if-changed .
        concurrency: 4

    test-dart:
      description: Run tests for pure-Dart packages (no Flutter SDK dependency).
      packageFilters:
        flutter: false
        dirExists: [test]
      exec:
        command: dart test
        concurrency: 1
        failFast: false

    test-flutter:
      description: Run tests for Flutter packages and the app.
      packageFilters:
        flutter: true
        dirExists: [test]
      exec:
        command: flutter test
        concurrency: 1
        failFast: false

    test:
      description: Run the full test suite (pure-Dart, then Flutter).
      steps:
        - test-dart
        - test-flutter

    build-linux:
      description: Smoke-build the app shell for Linux desktop.
      packageFilters:
        scope: sigmadraw
      exec:
        command: flutter build linux --debug
        concurrency: 1
