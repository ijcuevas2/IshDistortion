# Shared analysis options for pure-Dart packages (no Flutter SDK dependency).
# Flutter packages/apps use analysis_options_flutter.yaml instead.
#
# Package-local files do:
#   include: ../../analysis_options.yaml
include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_relative_imports
    - unawaited_futures
    - unnecessary_await_in_return
    - use_super_parameters
