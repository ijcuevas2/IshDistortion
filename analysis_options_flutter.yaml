# Shared analysis options for Flutter packages and the app shell.
# Pure-Dart packages use analysis_options.yaml instead.
#
# Package-local files do:
#   include: ../../analysis_options_flutter.yaml
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "build/**"
    - "android/**"
    - "ios/**"
    - "windows/**"
    - "macos/**"
    - "linux/**"
    - "web/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_relative_imports
    - unawaited_futures
    - unnecessary_await_in_return
    - use_super_parameters
